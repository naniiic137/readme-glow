<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Four live cursors from different teammates gathering around one sticky note">
  <title>Live cursors</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0A2A"/>
      <stop offset="1" stop-color="#2E1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C026D3" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="#FFFFFF" fill-opacity="0.1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <path id="arrow" d="M0 0v26l7-6.5 5.2 11 4.2-1.8-5-10.8H20z"/>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="260" rx="380" ry="230" fill="url(#glow)"/>

  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 10">
    <path d="M110 80c120 10 250 40 336 90" stroke="#F472B6"/>
    <path d="M1110 70c-140 20-270 50-356 86" stroke="#A78BFA"/>
    <path d="M120 470c120-40 230-80 344-116" stroke="#2DD4BF"/>
    <path d="M1090 460c-120-40-240-80-346-122" stroke="#FBBF24"/>
  </g>

  <g transform="rotate(-3 600 255)" filter="url(#soft)">
    <rect x="470" y="160" width="260" height="190" rx="10" fill="#FEF08A"/>
    <rect x="470" y="160" width="260" height="22" rx="10" fill="#FDE047"/>
    <text x="496" y="236" font-size="28" font-weight="800" fill="#1F2937">Ship the beta</text>
    <text x="496" y="272" font-size="28" font-weight="800" fill="#1F2937">on Friday</text>
    <text x="496" y="326" font-size="14" font-weight="600" fill="#854D0E">4 people editing</text>
    <circle cx="664" cy="321" r="9" fill="#DB2777" stroke="#FEF08A" stroke-width="2"/>
    <circle cx="678" cy="321" r="9" fill="#7C3AED" stroke="#FEF08A" stroke-width="2"/>
    <circle cx="692" cy="321" r="9" fill="#0F766E" stroke="#FEF08A" stroke-width="2"/>
    <circle cx="706" cy="321" r="9" fill="#B45309" stroke="#FEF08A" stroke-width="2"/>
  </g>

  <g font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <g transform="translate(446 170)">
      <use href="#arrow" fill="#DB2777" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="-70" y="-38" width="64" height="26" rx="13" fill="#DB2777"/>
      <text x="-38" y="-20">Amira</text>
    </g>
    <g transform="translate(750 152)">
      <use href="#arrow" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="22" y="-30" width="68" height="26" rx="13" fill="#7C3AED"/>
      <text x="56" y="-12">Hamza</text>
    </g>
    <g transform="translate(462 350)">
      <use href="#arrow" fill="#0F766E" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="-64" y="30" width="48" height="26" rx="13" fill="#0F766E"/>
      <text x="-40" y="48">Leo</text>
    </g>
    <g transform="translate(742 334)">
      <use href="#arrow" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="20" y="30" width="50" height="26" rx="13" fill="#B45309"/>
      <text x="45" y="48">Mei</text>
    </g>
  </g>

  <g transform="translate(520 440)">
    <rect width="160" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="22" cy="18" r="5" fill="#22C55E"/>
    <circle cx="22" cy="18" r="9" fill="#22C55E" fill-opacity="0.25"/>
    <text x="38" y="23.5" font-size="14" font-weight="600" fill="#E9D5FF">Live · 38 ms p95</text>
  </g>
</svg>
